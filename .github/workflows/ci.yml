name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify packed consumer import
        shell: bash
        run: |
          pack=$(npm pack --silent)
          target=$(mktemp -d)
          cd "$target"
          npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$pack" >/dev/null
          node --input-type=module -e 'import("schema-evolution-planner").then((module) => { if (typeof module.planEvolution !== "function") process.exit(1); })'
